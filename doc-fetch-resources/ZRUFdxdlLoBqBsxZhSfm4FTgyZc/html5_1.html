<html style="margin:0;padding:0;">
<title>ERA Agent运营分析闭环</title>
<div style="width:100%;box-sizing:border-box;padding:20px;background:#f5f7fa;font-family:Arial,'Microsoft YaHei',sans-serif;color:#1f2937;">
  <div style="max-width:980px;margin:auto;">
    <div style="font-size:22px;font-weight:700;margin-bottom:6px;">ERA：从行为数据到 Agent 持续优化</div>
    <div style="font-size:14px;color:#64748b;margin-bottom:18px;">Agent 运营分析闭环（示意）</div>

    <div style="display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;">
      <div style="flex:1 1 140px;min-width:140px;padding:14px;border-radius:10px;background:#e8f1ff;border:1px solid #b9d3fa;">

      </div>
      <div style="align-self:center;font-size:24px;color:#64748b;">→</div>

      </div>

      <div style="flex:1 1 140px;min-width:140px;padding:14px;border-radius:10px;background:#fff5df;border:1px solid #f1d499;">

      </div>

    </div>

    <div style="margin-top:15px;padding:12px 16px;border-left:4px solid #2563eb;background:white;border-radius:6px;font-size:14px;">
